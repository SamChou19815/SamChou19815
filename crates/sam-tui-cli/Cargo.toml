[package]
name = "sam-tui-cli"
version = "0.1.0"
description = "Native terminal front-end for the Developer Sam TUI"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "dev-sam"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
iocraft = { version = "0.8.4", features = ["unstable-output-streams"] }
sam-tui = { path = "../sam-tui" }

[lints]
workspace = true
