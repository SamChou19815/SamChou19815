[package]
name = "sam-tui"
version = "0.1.0"
description = "Full-screen TUI core for developersam.com/terminal, built on iocraft"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# iocraft: React-style component framework for the TUI. Both it and crossterm
# are wasm-patched at build time; see patches/README.md.
iocraft = { version = "0.8.4", features = ["unstable-output-streams"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
taffy = "0.5"

[lints.rust]
# The wasm FFI module exports the C ABI with `#[unsafe(no_mangle)]`, which the
# workspace-wide `unsafe_code = "forbid"` (passed as -F unsafe-code) rejects.
# Re-declaring the lint here opts this crate out; it contains no `unsafe` blocks.
unsafe_code = "allow"

[lints.clippy]
all = "warn"
