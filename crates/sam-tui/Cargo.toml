[package]
name = "sam-tui"
version = "0.1.0"
description = "Full-screen TUI core for developersam.com/terminal, built on iocraft"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# iocraft: React-style component framework for the TUI. Both it and crossterm
# are wasm-patched at build time; see patches/README.md.
iocraft = { version = "0.8.4", features = ["unstable-output-streams"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
taffy = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# Host-side only: build.rs bakes the homepage artwork into small RGB grids, so
# no decoder ever reaches the wasm binary. Pure Rust, so `unsafe_code = "forbid"`
# is unaffected.
[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lints]
workspace = true
