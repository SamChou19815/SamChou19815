[workspace]
resolver = "2"
members = ["crates/*"]

# wasm32-patched third-party crates, materialized into .patched-deps/ by
# scripts/prepare-patched-deps.sh; see patches/README.md.
[patch.crates-io]
crossterm = { path = ".patched-deps/crossterm" }
iocraft = { path = ".patched-deps/iocraft" }

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Sam Zhou <sam@developersam.com>"]
repository = "https://github.com/SamChou19815/SamChou19815"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
directories = "6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
strip = "symbols"
