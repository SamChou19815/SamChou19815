name: Rust
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-build-debug
      - name: Prepare patched deps
        run: ./scripts/prepare-patched-deps.sh
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --no-deps --tests --bins -- -D warnings
      - name: Build
        run: cargo build --tests --bins
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-wasm
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build Terminal WASM
        # Also runs prepare-patched-deps.sh.
        run: ./scripts/build-wasm.sh
      - name: Check committed wasm-bindgen types are up to date
        run: git diff --exit-code packages/www/src/app/generated/sam_tui.d.ts
  test-sam-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-test
      - name: Prepare patched deps
        run: ./scripts/prepare-patched-deps.sh
      - name: Test
        run: cargo test -p sam-tui -p sam-tui-cli
  test-sam-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-sam-run
      - name: Verify sam-run is on PATH
        run: |
          command -v sam-run
          sam-run --version
          ./sam-cli --help
