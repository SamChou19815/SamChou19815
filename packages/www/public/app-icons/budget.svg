<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- A donut of spending categories, 45% / 30% / 25%, with equal gaps (r=124). -->
  <g fill="none" stroke-width="60" transform="rotate(-90 256 256)">
    <circle cx="256" cy="256" r="124" stroke="#ffffff" stroke-dasharray="0 7 332 440.1"/>
    <circle cx="256" cy="256" r="124" stroke="#ffffff" stroke-opacity="0.6" stroke-dasharray="0 353 221 205.1"/>
    <circle cx="256" cy="256" r="124" stroke="#064e3b" stroke-opacity="0.55" stroke-dasharray="0 588 184 7.1"/>
  </g>
</svg>
